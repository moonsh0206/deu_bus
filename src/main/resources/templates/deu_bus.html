<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동의대 학생 포털</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        function goToBusInfo() {
            window.location.href = "map"; // B페이지로 이동
        }
    </script>
    <style>
        /* 전체 레이아웃 설정 */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f8ff;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 사이드바 스타일 */
        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #003c8f, #005bb5);
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar ul li {
            padding: 10px;
            border-radius: 8px;
            transition: background 0.3s;
        }

        .sidebar ul li:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* 메인 컨텐츠 스타일 */
        .main-content {
            flex: 2;
            padding: 20px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: auto auto;
            gap: 20px;
        }

        .content-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .schedule-box {
            height: 400px;
            background: #e3f2fd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #7daddc;
            grid-column: 1 / 2;
            grid-row: 1 / 3;
        }

        .weather-box, .meal-box {
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
        }

        .weather-box { background: #ffebee; color: #d32f2f; grid-column: 2 / 3; grid-row: 1 / 2; }
        .meal-box { background: #e8f5e9; color: #388e3c; grid-column: 2 / 3; grid-row: 2 / 3; }

        .restaurant-box, .notice-box {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
        }

        .restaurant-box { background: #ede7f6; color: #5e35b1; grid-column: 1 / 2; grid-row: 3 / 4; }
        .notice-box { background: #fff3e0; color: #ef6c00; grid-column: 2 / 3; grid-row: 3 / 4; }

        /* 오른쪽 정보 패널 */
        .info-panel {
            width: 300px;
            padding: 20px;
            background: linear-gradient(180deg, #005bb5, #307dcb);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .user-card {
            text-align: center;
            padding: 20px;
        }

        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 10px;
        }

        /* 맛집 컨테이너 */
        .restaurant-container {
            display: flex;
            align-items: center;
            overflow: hidden;
            position: relative;
            grid-column: 1 / 3;
            grid-row: 3 / 4;
        }

        .restaurant-box {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            white-space: nowrap;
            gap: 10px;
            padding: 10px;
            width: 90%;
        }

        .restaurant-box {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            white-space: nowrap;
            gap: 10px;
            padding: 10px;
            width: 90%;
        }

        .restaurant-box a {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 200px;
            text-decoration: none;
            color: black;
        }

        .restaurant-box a img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }

        .restaurant-box a span {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 사용자 정보 패널 -->
    <div class="info-panel">
        <div class="user-card">
            <img src="chill.jfif" alt="프로필 사진" class="profile-pic">
            <h3>문성훈</h3>
            <p>20212974</p>
        </div>
        <div class="sidebar">
            <h2>메뉴</h2>
            <ul>
                <li>홈</li>
                <li>버스정보</li>
                <!-- A페이지의 좌측 메뉴 -->
                <nav>
                    <ul>
                        <li><button onclick="goToBusInfo()">실시간 버스정보</button></li>
                    </ul>
                </nav>

                <li>실시간 지하철 정보</li>
                <li>로그아웃</li>
            </ul>
        </div>
    </div>

    <!-- 메인 컨텐츠 -->
    <div class="main-content">
        <div class="content-box schedule-box">시간표 API 적용 예정</div>
        <div class="content-box weather-box">날씨 API 적용 예정</div>
        <div class="content-box meal-box">오늘의 학식 API 적용 예정</div>
        <div class="content-box restaurant-box">동의대만의 맛집추천!</div>
        <div class="content-box notice-box">공지사항 / 유용한 정보</div>
        <div class="restaurant-box" id="restaurantBox">
            <a href="https://map.naver.com/p/entry/place/1891636230" target="_blank">
                <img src="https://search.pstatic.net/common/?src=https%3A%2F%2Fldb-phinf.pstatic.net%2F20220909_42%2F1662694659710opS2L_JPEG%2F0B543857-0464-4DA3-907D-1E2898678754.jpeg" alt="음식점1">
                <span>덮집회의</span>
            </a>
            <a href="https://map.naver.com/p/search/%EC%88%98%EA%B5%AC%EB%A0%88%EA%B5%AD%EB%B0%A5%20" target="_blank">
                <img src="https://search.pstatic.net/common/?src=http%3A%2F%2Fblogfiles.naver.net%2FMjAyNDEyMjdfMjMy%2FMDAxNzM1Mjc3OTk2MDM5.vQ3i5ZNelllm7-mpKIEgV6cupP-UxKvqD1OeUvjcrWIg.awQaMhww9hHfSULjztYnyDAZ_PM_zRuwTo7AAaNSlrAg.JPEG%2F20211120_072923.jpg" alt="음식점2">
                <span>가야포차 선지국밥</span>
            </a>
            <a href="https://map.naver.com/p/search/%EB%8F%99%EC%9D%98%EB%8C%80%20%EC%A4%91%EA%B5%AD%EC%A7%91" target="_blank">
                <img src="https://search.pstatic.net/common/?src=https%3A%2F%2Fldb-phinf.pstatic.net%2F20231207_108%2F1701920477382ClnqD_JPEG%2F30BB367D-DC81-487F-ACA8-3522579634A1.jpeg" alt="음식점3">
                <span>수라반점</span>
            </a>
        </div>
        <button class="scroll-btn scroll-right" onclick="scrollRight()">❯</button>
    </div>
</div>
</div>
<script>
    function scrollLeft() {
        document.getElementById('restaurantBox').scrollBy({ left: -220, behavior: 'smooth' });
    }
    function scrollRight() {
        document.getElementById('restaurantBox').scrollBy({ left: 220, behavior: 'smooth' });
    }
</script>
</body>
</html>
